<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Test - Agilus Diagnostics</title>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,300,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Agilus Diagnostics</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="book-a-test.html" class="btn">Book a Test</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-main">
        <section class="page-header">
            <h1>Book a Home Test</h1>
            <p>Fill out the form below to schedule a home sample collection.</p>
        </section>

        <section class="booking-form-section">
            <form class="booking-form">
                <div class="form-group">
                    <input type="text" id="name" name="name" required>
                    <label for="name">Full Name</label>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" required>
                    <label for="email">Email Address</label>
                </div>
                <div class="form-group">
                    <input type="tel" id="phone" name="phone" required>
                    <label for="phone">Phone Number</label>
                </div>
                <div class="form-group">
                    <select id="test" name="test" required>
                        <option value="" disabled selected>Select a Test or Package</option>
                        <option value="fbc">Full Body Checkup</option>
                        <option value="blood">Blood Tests</option>
                        <option value="hormone">Hormone Tests</option>
                        <option value="vitamin">Vitamin Tests</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="date" id="date" name="date" required>
                    <label for="date" class="date-label">Preferred Date</label>
                </div>
                <button type="submit" class="btn-submit">Schedule Collection</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Agilus Diagnostics. All rights reserved.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
